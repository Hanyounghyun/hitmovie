<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미국 상영 인기 영화 TOP 30</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <header class="site-header">
    <h1>미국 상영 인기 영화 TOP 30</h1>
    <p class="subtitle">
      TMDB <code>movie/top_rated</code> · 상세 API의 <strong>전 세계 흥행 수익</strong>(USD)만 표시합니다.
    </p>
  </header>

  <main class="container">
    <div id="status" class="status" role="status" aria-live="polite">영화 정보를 불러오는 중…</div>
    <ul id="movie-list" class="movie-grid" hidden></ul>
  </main>

  <footer class="site-footer">
    <p>데이터 제공 <a href="https://www.themoviedb.org/" rel="noopener noreferrer" target="_blank">The Movie Database (TMDB)</a></p>
    <p class="site-footer__note">수익은 영화별 상세 응답의 <code>revenue</code> 필드이며, 출처·갱신 시점에 따라 다른 박스오피스 사이트와 숫자가 다를 수 있습니다.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
